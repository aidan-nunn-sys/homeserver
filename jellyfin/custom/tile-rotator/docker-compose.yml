services:
  jellyfin-tile-rotator:
    container_name: jellyfin-tile-rotator
    image: python:3.13-alpine
    restart: unless-stopped
    command: python -u /jellyfin/custom/tile-rotator/rotate.py
    volumes:
      - ../../scripts:/jellyfin/scripts:ro
      - ./rotate.py:/jellyfin/custom/tile-rotator/rotate.py:ro
    env_file: .env
