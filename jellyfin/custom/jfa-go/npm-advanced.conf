# NPM "Advanced" config for <JOIN_HOST>. Only the signup, My Account and
# reset pages are public; the admin UI and API stay LAN/Tailscale-only.
# A "location /" here stops NPM adding its own catch-all proxy.

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_buffering off;

# Signup form and its submit call
location /invite/ { proxy_pass http://<JFA_LAN>:8056; }
location = /user/invite { proxy_pass http://<JFA_LAN>:8056; }

# My Account page and its API (/my/details, /my/email, /my/password, ...)
location /my/ { proxy_pass http://<JFA_LAN>:8056; }

# Password reset link page
location = /reset { proxy_pass http://<JFA_LAN>:8056; }

# Translations and static assets
location /lang/ { proxy_pass http://<JFA_LAN>:8056; }
location /css/ { proxy_pass http://<JFA_LAN>:8056; }
location /js/ { proxy_pass http://<JFA_LAN>:8056; }
location /fonts/ { proxy_pass http://<JFA_LAN>:8056; }
location ~ ^/(favicon\.ico|favicon-(16x16|32x32)\.png|apple-touch-icon\.png|safari-pinned-tab\.svg|site\.webmanifest|banner\.svg)$ {
    proxy_pass http://<JFA_LAN>:8056;
}

# The admin page lives at "/"; send visitors to My Account instead.
location = / { return 302 /my/account; }
location / { return 404; }
